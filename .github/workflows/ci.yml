name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git python python-gobject python-cairo gtk4 libadwaita \
            gstreamer gst-plugins-base gst-plugins-good python-numpy python-pillow python-requests \
            python-urllib3 python-zeroconf python-pytest python-pip openssl xorg-server-xvfb \
            pipewire wireplumber gst-plugin-pipewire
          pip install --break-system-packages pydbus
      - uses: actions/checkout@v4
      - name: Run tests (fake Hue bridge, X11 capture under Xvfb, fake gamescope node)
        run: PYTHONPATH=src:tests xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest -v -W ignore::Warning tests

  flatpak:
    name: Flatpak bundle
    # Builds run on merge to main (and v* tags), not on pull requests:
    # PRs only run the tests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: lumux.flatpak
          manifest-path: flatpak/io.github.enginkirmaci.lumux.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: lumux-flatpak
          path: lumux.flatpak

  decky:
    name: Decky plugin zip
    # Builds run on merge to main (and v* tags), not on pull requests:
    # PRs only run the tests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Decky CLI (the version the plugin store CI uses)
        run: |
          mkdir -p /tmp/decky-cli
          curl -fL -o /tmp/decky-cli/decky \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64
          chmod +x /tmp/decky-cli/decky
      - name: Build plugin (same command as decky-plugin-database)
        run: |
          sudo /tmp/decky-cli/decky plugin build -b -o out -s plugin-name decky
          sudo chown -R "$(id -u):$(id -g)" decky out
          mv out/*.zip decky-lumux.zip  # named after plugin.json "name"
      - name: Check zip layout
        run: |
          unzip -l decky-lumux.zip
          # The plugin downloads this release's lumux.flatpak: the pin must match
          python3 scripts/check-decky-zip.py decky-lumux.zip \
            --lumux-version "$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
      - uses: actions/upload-artifact@v4
        with:
          name: decky-lumux
          path: decky-lumux.zip

  version:
    name: Release check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Decide whether this run publishes a release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tag="v${version}"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Every merge to main that bumps the version publishes it: the
            # tag doesn't exist yet, so create it with the release.
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::notice::${tag} is already released; bump the version in pyproject.toml to publish a new release"
            else
              release=true
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "version ${version} -> tag ${tag}, release=${release}"

  release:
    name: GitHub release
    if: needs.version.outputs.release == 'true'
    needs: [version, test, flatpak, decky]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumux-flatpak
      - uses: actions/download-artifact@v4
        with:
          name: decky-lumux
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            lumux.flatpak
            decky-lumux.zip
          generate_release_notes: true
